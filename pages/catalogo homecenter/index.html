<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Homecenter · ConstruMaster</title>
  <link rel="stylesheet" href="../../assets/motor/estilos_modelo.css">
  <style>
    .grilla-departamentos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 8px; }
    .tarjeta-subcat { background: var(--color-panel); border: 1px solid var(--color-borde); border-radius: var(--radio); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .tarjeta-subcat .nombre { font-weight: 600; font-size: 0.92rem; }
    .tarjeta-subcat .conteo { font-size: 0.8rem; color: var(--color-texto-suave); }
    .tarjeta-subcat .acciones-subcat { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .tarjeta-subcat a { font-size: 0.78rem; color: var(--color-negra); text-decoration: none; }
    .tarjeta-subcat a:hover { text-decoration: underline; }
    label.chk-seleccion { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--color-texto-suave); cursor: pointer; }
    .bloque-subcat { border: 1px solid var(--color-borde); border-radius: var(--radio); margin-bottom: 14px; overflow: hidden; }
    .cabecera-subcat { background: var(--color-panel); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .cabecera-subcat .nombre { font-weight: 600; font-size: 0.92rem; }
    .cabecera-subcat .conteo { font-size: 0.8rem; color: var(--color-texto-suave); }
    .cabecera-subcat .acciones-subcat { display: flex; align-items: center; gap: 14px; }
    .cabecera-subcat a { font-size: 0.78rem; color: var(--color-negra); text-decoration: none; }
    .cabecera-subcat a:hover { text-decoration: underline; }
    .detalle-productos { border-top: 1px solid var(--color-borde); background: var(--color-fondo, transparent); }
    .detalle-productos summary { cursor: pointer; padding: 10px 16px; font-size: 0.82rem; font-weight: 600; list-style: none; }
    .detalle-productos summary::-webkit-details-marker { display: none; }
    .detalle-productos[open] summary { border-bottom: 1px solid var(--color-borde); }
    .detalle-productos .grilla-departamentos { padding: 14px 16px; margin-bottom: 0; }
    .aviso-nota { background: #fff8e6; border: 1px solid #f0dca0; border-radius: var(--radio); padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; }
    .lista-seleccion li { margin-bottom: 6px; }
    .lista-seleccion button { background: none; border: none; color: #b3261e; cursor: pointer; font-size: 0.75rem; margin-left: 8px; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="marca">ConstruMaster<span>Catálogo Homecenter · mapa de categorías</span></div>
    <nav class="navtabs" id="navtabs"></nav>
  </header>
  <div class="cuerpo">
    <aside class="sidebar" id="sidebar-contenido"></aside>
    <main class="contenido" id="main-contenido"></main>
  </div>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
