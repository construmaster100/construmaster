<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo COMFER · ConstruMaster</title>
  <link rel="stylesheet" href="../../assets/motor/estilos_modelo.css">
  <style>
    .aviso-nota { background: #fff8e6; border: 1px solid #f0dca0; border-radius: var(--radio); padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; }
    .grilla-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .tarjeta-producto { background: var(--color-panel); border: 1px solid var(--color-borde); border-radius: var(--radio); overflow: hidden; display: flex; flex-direction: column; }
    .tarjeta-producto .visual-producto { height: 160px; position: relative; background: #f0f1f4; }
    .tarjeta-producto img { width: 100%; height: 160px; object-fit: cover; display: block; background: #eee; }
    .tarjeta-producto .imagen-ausente { display: none; height: 160px; place-items: center; align-content: center; gap: 8px; padding: 16px; background: #f0f1f4; color: var(--color-texto-suave); font-size: 0.78rem; text-align: center; }
    .tarjeta-producto .imagen-ausente strong { color: var(--color-negra); font-size: 0.75rem; }
    .tarjeta-producto .imagen-ausente span { font-weight: 700; color: var(--color-negra); }
    .tarjeta-producto.sin-imagen .imagen-ausente { display: grid; }
    .tarjeta-producto.sin-imagen img { display: none; }
    .tarjeta-producto .cuerpo { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .tarjeta-producto .nombre { font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
    .tarjeta-producto .precio { font-size: 0.9rem; color: var(--color-negra); font-weight: 700; margin-top: auto; }
    .tarjeta-producto a.enlace-original { font-size: 0.72rem; color: var(--color-texto-suave); }
    input.buscador-productos { width: 100%; max-width: 420px; padding: 10px 14px; border: 1px solid var(--color-borde); border-radius: 8px; font-size: 0.92rem; margin-bottom: 14px; }
    .bloque-subcat { border: 1px solid var(--color-borde); border-radius: var(--radio); margin-bottom: 14px; overflow: hidden; }
    .cabecera-subcat { background: var(--color-panel); padding: 14px 16px; }
    .cabecera-subcat .nombre { font-weight: 600; font-size: 0.92rem; }
    .cabecera-subcat .conteo { font-size: 0.8rem; color: var(--color-texto-suave); }
    .detalle-productos { border-top: 1px solid var(--color-borde); }
    .detalle-productos summary { cursor: pointer; padding: 10px 16px; font-size: 0.82rem; font-weight: 600; list-style: none; }
    .detalle-productos summary::-webkit-details-marker { display: none; }
    .detalle-productos[open] summary { border-bottom: 1px solid var(--color-borde); }
    .detalle-productos .grilla-productos { padding: 14px 16px; margin-bottom: 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="../../index.html" title="Volver a ConstruMaster">
      <span class="logo-emblema">CM<small>construmaster</small></span>
    </a>
    <div class="site-banner" role="img" aria-label="Catálogo COMFER"></div>
  </header>
  <nav class="topnav" aria-label="Navegación">
    <div class="navtabs" id="navtabs"></div>
  </nav>
  <div class="cuerpo">
    <aside class="sidebar" id="sidebar-contenido"></aside>
    <main class="contenido" id="main-contenido"></main>
  </div>
  <script src="js/datos.js"></script>
  <script src="js/productos_v1.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
