<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador · ConstruMaster</title>
  <link rel="stylesheet" href="../../assets/motor/estilos_modelo.css">
  <style>
    .aviso-nota { background: #fff8e6; border: 1px solid #f0dca0; border-radius: var(--radio); padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; }
    .lista-enlaces-catalogo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .lista-enlaces-catalogo a, .lista-enlaces-catalogo button { display: block; width: 100%; text-align: left; background: var(--color-panel); border: 1px solid var(--color-borde); border-radius: var(--radio); padding: 14px 16px; text-decoration: none; color: var(--color-texto); cursor: pointer; font: inherit; font-size: 0.9rem; }
    .lista-enlaces-catalogo a:hover, .lista-enlaces-catalogo button:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .campo-nota { background: var(--color-panel); border: 1px solid var(--color-borde); border-radius: var(--radio); padding: 14px 16px; margin-bottom: 12px; }
    .campo-nota label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .campo-nota textarea { width: 100%; min-height: 70px; padding: 8px 10px; border: 1px solid var(--color-borde); border-radius: 6px; font: inherit; font-size: 0.85rem; resize: vertical; }
    .barra-guardado { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .barra-guardado .estado-guardado { font-size: 0.8rem; color: var(--color-texto-suave); }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="../../index.html" title="Volver a ConstruMaster">
      <span class="logo-emblema">CM<small>construmaster</small></span>
    </a>
    <div class="site-banner" role="img" aria-label="Panel de administrador"></div>
  </header>
  <nav class="topnav" aria-label="Navegación">
    <div class="navtabs" id="navtabs"></div>
  </nav>
  <div class="cuerpo">
    <aside class="sidebar" id="sidebar-contenido"></aside>
    <main class="contenido" id="main-contenido"></main>
  </div>
  <script src="../../assets/motor/jszip.min.js"></script>
  <script src="../../assets/motor/xlsx.full.min.js"></script>
  <script src="../../assets/motor/motor.js"></script>
  <script src="../../docs/Matriz/Modelo Boulevard/js/datos.js"></script>
  <script src="../../docs/Matriz/Modelo Construmaster/js/datos.js"></script>
  <script src="../etapas de obra/js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
